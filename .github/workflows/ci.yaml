# Test gate on every PR and push to main.
#
# signet is a plain Go binary (no cgo), so one runner covers gofmt, vet, and
# the test suite; a cross-compile check proves the other release target still
# builds.
name: ci

on:
  push:
    branches: [main]
    paths:
      - '**.go'
      - 'go.mod'
      - 'go.sum'
      - 'Makefile'
      - '.github/workflows/ci.yaml'
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest # by-exception (2026-07-04): public repo, GitHub cannot resolve the self-hosted-runner reusable this fleet standardises on

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.25'
          # Without this, setup-go keeps the runner image's preinstalled Go when it
          # satisfies the spec, so a floating '1.25' silently stops floating. That is
          # how v2026.8.2 — cut solely to rebuild v2026.8.1 on a patched toolchain —
          # produced another 1.25.12 binary and left #11's seven HIGH stdlib
          # advisories exactly where they were.
          check-latest: true
          cache-dependency-path: go.sum

      - name: gofmt
        run: |
          out="$(gofmt -l ./cmd ./internal)"
          if [ -n "$out" ]; then
            echo "gofmt needs running on:" >&2
            echo "$out" >&2
            exit 1
          fi

      - name: go vet
        run: CGO_ENABLED=0 go vet ./...

      - name: Test
        run: make test

      - name: Cross-compile check (darwin/arm64)
        run: CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -o /dev/null ./cmd/signet

      # by-exception (2026-07-04): public repo — GitHub cannot resolve the
      # private ntfy-failure composite action at job setup, so the equivalent
      # curl is inlined (matching the action's behaviour exactly).
      - name: Notify failure (ntfy infra)
        if: failure() && github.event_name != 'pull_request'
        env:
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl -sS --max-time 10 \
            -H "Authorization: Bearer $NTFY_TOKEN" \
            -H "Title: signet: ci failed" \
            -H "Priority: 4" \
            -H "Tags: rotating_light" \
            -d "Run: $RUN_URL" \
            "https://ntfy.godswood.au/infra" \
            || echo "::warning::ntfy-failure: notification POST failed"
