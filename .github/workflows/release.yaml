# Build and publish signet release binaries.
#
# signet is a plain Go binary (no cgo), so both release targets cross-compile
# from one runner via GOOS/GOARCH.
name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version, e.g. 2026.6.0 (no v prefix)'
        required: true

permissions:
  contents: write # create the GitHub Release and upload artifacts

jobs:
  build:
    name: Build signet (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest # by-exception (2026-07-03): public repo, no self-hosted runner access; no cgo, so cross-compiles cleanly here
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: darwin
            goarch: arm64
          - goos: linux
            goarch: amd64
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.27'
          # Without this, setup-go keeps the runner image's preinstalled Go when it
          # satisfies the spec, so a floating '1.25' silently stops floating. That is
          # how v2026.8.2 — cut solely to rebuild v2026.8.1 on a patched toolchain —
          # produced another 1.25.12 binary and left #11's seven HIGH stdlib
          # advisories exactly where they were.
          check-latest: true
          cache-dependency-path: go.sum

      - name: Resolve version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            v="${{ inputs.version }}"
          else
            v="${GITHUB_REF_NAME#v}"
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "Releasing signet $v (${{ matrix.goos }}/${{ matrix.goarch }})"

      - name: Build signet
        id: build_go
        env:
          CGO_ENABLED: '0'
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          go version
          go build -ldflags "-X main.version=${{ steps.ver.outputs.version }}" -o signet-bin ./cmd/signet
          echo "bin=$PWD/signet-bin" >> "$GITHUB_OUTPUT"

      - name: Package signet tarball + checksum
        id: pkg_go
        run: |
          V="${{ steps.ver.outputs.version }}"
          TAR="signet-${V}-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz"
          BINDIR="$(dirname "${{ steps.build_go.outputs.bin }}")"
          mv "$BINDIR/signet-bin" "$BINDIR/signet"
          tar -czf "$TAR" -C "$BINDIR" signet
          shasum -a 256 "$TAR" | tee "$TAR.sha256"
          echo "tar=$TAR" >> "$GITHUB_OUTPUT"
          echo "sha=$TAR.sha256" >> "$GITHUB_OUTPUT"

      - name: Publish artifacts to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="${{ steps.ver.outputs.version }}"
          TAG="v${V}"
          NOTES="Single Go binary attest client for Portcullis: a P-256 key in a PKCS8 PEM file, signed challenges traded for a short-lived bearer. Install and wiring: README.md. Verify with the published .sha256 files."

          # First job to run creates the release; subsequent jobs upload to it.
          # --clobber is safe: artifacts are per-platform so they never collide.
          gh release create "$TAG" --title "signet v${V}" --notes "$NOTES" \
            "${{ steps.pkg_go.outputs.tar }}" "${{ steps.pkg_go.outputs.sha }}" \
            2>/dev/null \
            || gh release upload "$TAG" \
              "${{ steps.pkg_go.outputs.tar }}" "${{ steps.pkg_go.outputs.sha }}" \
              --clobber

      # by-exception (2026-07-04): public repo — GitHub cannot resolve the
      # private ntfy-failure composite action at job setup, so the equivalent
      # curl is inlined (matching the action's behaviour exactly).
      - name: Notify failure (ntfy infra)
        if: failure() && github.event_name != 'pull_request'
        env:
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl -sS --max-time 10 \
            -H "Authorization: Bearer $NTFY_TOKEN" \
            -H "Title: signet: release build failed" \
            -H "Priority: 4" \
            -H "Tags: rotating_light" \
            -d "Run: $RUN_URL" \
            "https://ntfy.godswood.au/infra" \
            || echo "::warning::ntfy-failure: notification POST failed"
